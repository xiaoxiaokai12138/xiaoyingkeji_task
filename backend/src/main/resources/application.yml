spring:
  application:
    name: material-studio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/material_studio?connectionTimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:material_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
mybatis:
  configuration:
    map-underscore-to-camel-case: true
